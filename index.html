<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Amiri',serif;color:#d9d0bd;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.62) 100%)}
#grain{position:fixed;inset:-120px;pointer-events:none;z-index:31;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.7'/></svg>");animation:grain .8s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-25px,35px)}50%{transform:translate(30px,-20px)}75%{transform:translate(-20px,-30px)}100%{transform:translate(0,0)}}
#letterbox .bar{position:fixed;left:0;width:100%;height:0;background:#000;z-index:35;transition:height 1s ease}

.panelHint{text-align:center;margin-top:16px;color:#6f675a;font-size:17px}

@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

#touchUI{display:none}
body.touch #touchUI{display:block}

#btnPause i{display:block;width:5px;height:18px;background:rgba(217,208,189,.7)}
@media (max-width:700px){
 #subtitle{font-size:19px;bottom:19%;padding:0 7vw}
 #objective{font-size:13px;max-width:58vw;top:12px;right:12px}
 #prompt{font-size:17px;bottom:30%}
 #floorDisplay{font-size:52px}
 #noteText{font-size:20px}
 #elevatorPanel .ebtn{width:56px;height:56px;font-size:22px}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   الغرفة ١٣ — كمبيوتر + موبايل، ملف واحد
   الإصدار السادس: اللعبة كاملة —
   اللوبي ← الدور ١٢ (لغز الصورة + لغز الساعة + التليفون + ١٢١٣)
   ← الدور ١٣ (الممر الأحمر + الظلال + الغرفة ١٣١٣ + النهاية)
   ============================================================ */
const $=id=>document.getElementById(id);
const subEl=$('subtitle'),objEl=$('objective'),promptEl=$('prompt'),promptTxt=$('promptText'),
      fadeEl=$('fade'),fadeTxt=$('fadeText'),floorEl=$('floorDisplay'),panelEl=$('elevatorPanel'),
      noteEl=$('noteOverlay'),noteImg=$('noteImg'),noteText=$('noteText'),pauseEl=$('pause'),
      titleEl=$('title'),endEl=$('ending'),lbEl=$('letterbox'),btnGrid=$('btnGrid'),panelHint=$('panelHint'),
      joyBase=$('joyBase'),joyKnob=$('joyKnob'),btnE=$('btnE'),btnPause=$('btnPause');
const IS_TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH){ document.body.classList.add('touch');
  $('titleControls').innerHTML='المسي نصّ الشاشة الشمال = عصا الحركة — اسحبي على اليمين عشان تبصّي — زر <b>E</b> للتفاعل — ادفعي العصا للآخر = جري';
  $('titleWarn').textContent='الوضع الأفقي أحلى… بس العمودي شغال عادي.';
}else{
  $('titleControls').innerHTML='<b>W A S D</b> للحركة &nbsp;•&nbsp; <b>الماوس</b> للنظر &nbsp;•&nbsp; <b>E</b> للتفاعل &nbsp;•&nbsp; <b>Shift</b> للجري';
}

/* ================== اللوجو والأيقونة ================== */
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function makeIconCanvas(){
  const c=mkCanvas(512,512),x=c.getContext('2d');
  x.fillStyle='#050403'; x.fillRect(0,0,512,512);
  x.fillStyle='#241a10'; x.fillRect(96,70,320,420);
  x.fillStyle='#6e1d18'; x.fillRect(118,92,276,398);
  x.strokeStyle='rgba(0,0,0,.45)'; x.lineWidth=10;
  x.strokeRect(152,200,208,100); x.strokeRect(152,330,208,100);
  x.fillStyle='#c8a86a'; x.fillRect(196,108,120,74);
  x.fillStyle='#191410'; x.font='bold 58px Georgia'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('13',256,148);
  x.fillStyle='#191410'; x.beginPath(); x.arc(256,368,18,0,7); x.fill();
  x.fillRect(247,376,18,40);
  return c;
}
function applyIcon(){
  try{
    const c=makeIconCanvas(), url=c.toDataURL('image/png');
    const link=(rel,href,type)=>{ const l=document.createElement('link'); l.rel=rel; l.href=href; if(type)l.type=type; document.head.appendChild(l); return l; };
    link('icon',url,'image/png'); link('apple-touch-icon',url);
    const man={ name:'الغرفة 13', short_name:'الغرفة 13', description:'لعبة رعب — الدور ١٣',
      start_url:location.href.split('#')[0], display:'standalone', orientation:'any',
      background_color:'#050403', theme_color:'#050403',
      icons:[{src:url,sizes:'512x512',type:'image/png',purpose:'any'},
             {src:url,sizes:'192x192',type:'image/png',purpose:'any'},
             {src:url,sizes:'512x512',type:'image/png',purpose:'maskable'}] };
    link('manifest','data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man)));
    $('titleLogo').src=url; $('endLogo').src=url;
  }catch(e){}
}

/* ================== الصوت (Web Audio كله مولّد) ================== */
let AC=null,master=null,nbuf=null,droneG=null,droneF=null,humG=null,ringInt=null,heartInt=null,breathInt=null;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const len=AC.sampleRate*2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; } nbuf=b;
  const src=AC.createBufferSource(); src.buffer=nbuf; src.loop=true;
  droneF=AC.createBiquadFilter(); droneF.type='lowpass'; droneF.frequency.value=170;
  droneG=AC.createGain(); droneG.gain.value=0;
  src.connect(droneF).connect(droneG).connect(master); src.start();
  const o=AC.createOscillator(); o.frequency.value=47; const og=AC.createGain(); og.gain.value=.5;
  o.connect(og).connect(droneG); o.start();
}
function setDrone(g,f){ if(!droneG)return; const t=AC.currentTime; droneG.gain.linearRampToValueAtTime(g,t+1.5); droneF.frequency.linearRampToValueAtTime(f,t+1.5); }
function panNode(p){ if(AC.createStereoPanner){const n=AC.createStereoPanner();n.pan.value=p;return n;} return AC.createGain(); }
function env(g,t,a,v,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+d); }
function sfxStep(vol=.34,pan=0,muf=1){
  if(!AC)return; const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=(0.9+Math.random()*.2)*muf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=(360+Math.random()*180)*muf;
  const g=AC.createGain(); env(g,t,.012,vol,.2+muf*.08);
  const p=panNode(pan); s.connect(f).connect(g).connect(p).connect(master); s.start(t); s.stop(t+.3);
  const o=AC.createOscillator(); o.frequency.value=68+Math.random()*24; const og=AC.createGain(); env(og,t,.01,vol*.45,.11);
  o.connect(og).connect(p); o.start(t); o.stop(t+.14);
}
function sfxKnock(vol=1,pan=0){
  if(!AC)return; const t=AC.currentTime,p=panNode(pan);
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(48,t+.18);
  const g=AC.createGain(); env(g,t,.006,vol,.4); o.connect(g).connect(p).connect(master); o.start(t); o.stop(t+.45);
  const s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=1.7;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
  const g2=AC.createGain(); env(g2,t,.004,vol*.35,.12); s.connect(f).connect(g2).connect(p).connect(master); s.start(t); s.stop(t+.15);
}
function sfxDing(low=false){
  if(!AC)return; const t=AC.currentTime, base=low?[493,659]:[987,1318];
  base.forEach((fr,i)=>{ const o=AC.createOscillator(); o.frequency.value=fr*(low?.97:1);
    const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22/(i+1),t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+(low?2.2:1.4));
    o.connect(g).connect(master); o.start(t); o.stop(t+2.4); });
}
function sfxClick(){ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(); o.frequency.value=1900;
  const g=AC.createGain(); env(g,t,.002,.12,.05); o.connect(g).connect(master); o.start(t); o.stop(t+.07); }
function sfxTick(strong=false){ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(); o.frequency.value=strong?1500:1050;
  const g=AC.createGain(); env(g,t,.002,strong?.2:.09,strong?.09:.05); o.connect(g).connect(master); o.start(t); o.stop(t+.12); }
function sfxStatic(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=3;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1200;
  const g=AC.createGain(); env(g,t,.02,.25,.5); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+.6); }
function sfxDoor(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=.4;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260;
  const g=AC.createGain(); env(g,t,.08,.5,1.1); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.2);
  setTimeout(()=>sfxKnock(.25),900); }
function sfxWhisper(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=.8;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=6; f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(400,t+2.2);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.13,t+.9); g.gain.linearRampToValueAtTime(.0001,t+2.3);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+2.4); }
function sfxBreath(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=.5;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=2; f.frequency.value=520;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.09,t+.7); g.gain.linearRampToValueAtTime(.0001,t+1.7);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.8); }
function sfxHeart(){ if(!AC)return; [0,.22].forEach(dt=>{ const t=AC.currentTime+dt,o=AC.createOscillator(); o.frequency.value=58;
  const g=AC.createGain(); env(g,t,.01,.5,.18); o.connect(g).connect(master); o.start(t); o.stop(t+.22); }); }
function startRing(){ stopRing(); if(!AC)return; const burst=()=>{ const t=AC.currentTime;
  const o1=AC.createOscillator(),o2=AC.createOscillator(); o1.frequency.value=620; o2.frequency.value=832;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.13,t+.05);
  g.gain.setValueAtTime(.13,t+1.1); g.gain.linearRampToValueAtTime(.0001,t+1.25);
  const lfo=AC.createOscillator(); lfo.frequency.value=19; const lg=AC.createGain(); lg.gain.value=.09;
  lfo.connect(lg).connect(g.gain); lfo.start(t); lfo.stop(t+1.3);
  o1.connect(g); o2.connect(g); g.connect(master); o1.start(t); o2.start(t); o1.stop(t+1.3); o2.stop(t+1.3); };
  burst(); ringInt=setInterval(burst,2600); }
function stopRing(){ if(ringInt){clearInterval(ringInt);ringInt=null;} }
function startHum(){ stopHum(); if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=52;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;
  humG=AC.createGain(); humG.gain.setValueAtTime(.0001,t); humG.gain.linearRampToValueAtTime(.14,t+1);
  o.connect(f).connect(humG).connect(master); o.start(); humG._o=o; }
function stopHum(){ if(humG){ try{humG.gain.linearRampToValueAtTime(.0001,AC.currentTime+.8); const o=humG._o; setTimeout(()=>o.stop(),900);}catch(e){} humG=null; } }
function startHeart(bpm){ stopHeart(); sfxHeart(); heartInt=setInterval(sfxHeart,60000/bpm); }
function stopHeart(){ if(heartInt){clearInterval(heartInt);heartInt=null;} }
function startBreath(){ stopBreath(); breathInt=setInterval(sfxBreath,3400); }
function stopBreath(){ if(breathInt){clearInterval(breathInt);breathInt=null;} }
function stopLoops(){ stopRing(); stopHum(); stopHeart(); stopBreath(); }
function speakAr(t){ try{ if(!('speechSynthesis' in window))return; const u=new SpeechSynthesisUtterance(t);
  u.lang='ar-EG'; u.rate=.85; u.pitch=1.05; u.volume=.7; const v=speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)); if(v)u.voice=v;
  speechSynthesis.speak(u); }catch(e){} }

function drawPainting(c,stage){ // 0 عادي | 1 فيه الشخص | 2 الشخص اختفى | 3 النهاية

function drawClock(c,hh,mm){
  const x=c.getContext('2d'),cx=256,cy=256;
  x.clearRect(0,0,512,512);
  x.fillStyle='#191512'; x.beginPath(); x.arc(cx,cy,254,0,7); x.fill();
  const g=x.createRadialGradient(cx-70,cy-70,40,cx,cy,240); g.addColorStop(0,'#efe8d2'); g.addColorStop(1,'#c9bfa2');
  x.fillStyle=g; x.beginPath(); x.arc(cx,cy,236,0,7); x.fill();
  for(let i=0;i<60;i++){ const a=i/60*Math.PI*2, big=i%5===0;
    x.strokeStyle='#3a3226'; x.lineWidth=big?7:2; x.beginPath();
    x.moveTo(cx+Math.sin(a)*(big?206:216),cy-Math.cos(a)*(big?206:216));
    x.lineTo(cx+Math.sin(a)*226,cy-Math.cos(a)*226); x.stroke(); }
  x.fillStyle='#3a3226'; x.font='bold 52px Amiri, Georgia'; x.textAlign='center'; x.textBaseline='middle';
  [[12,0],[3,90],[6,180],[9,270]].forEach(n=>{ const a=n[1]/360*Math.PI*2;
    x.fillText(String(n[0]),cx+Math.sin(a)*172,cy-Math.cos(a)*172); });
  for(let i=0;i<26;i++){ x.fillStyle='rgba(120,95,55,'+(Math.random()*.12)+')'; x.beginPath();
    x.arc(cx+(Math.random()-.5)*380,cy+(Math.random()-.5)*380,Math.random()*26,0,7); x.fill(); }
  const ha=((hh%12)+mm/60)/12*Math.PI*2, ma=mm/60*Math.PI*2;
  x.strokeStyle='#241f16'; x.lineWidth=13; x.lineCap='round'; x.beginPath(); x.moveTo(cx,cy);
  x.lineTo(cx+Math.sin(ha)*108,cy-Math.cos(ha)*108); x.stroke();
  x.lineWidth=7; x.beginPath(); x.moveTo(cx,cy); x.lineTo(cx+Math.sin(ma)*176,cy-Math.cos(ma)*176); x.stroke();
  x.fillStyle='#241f16'; x.beginPath(); x.arc(cx,cy,14,0,7); x.fill();
}

function std(color,o={}){ return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.92,metalness:.03},o)); }
function addCol(x1,x2,z1,z2,y1=0,y2=3.2){
  const c={x1:Math.min(x1,x2),x2:Math.max(x1,x2),z1:Math.min(z1,z2),z2:Math.max(z1,z2),y1,y2};
  colliders.push(c); return c;
}
function box(w,h,d,x,y,z,mat,solid=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); world.add(m);
  if(solid) addCol(x-w/2,x+w/2,z-d/2,z+d/2,y-h/2,y+h/2);
  return m;
}
function plane(w,h,x,y,z,mat,rx=0,ry=0){

function makeRealDoor(side,doorZ,num,opts={}){
  const xw=side*1.575;
  const fm=std(0x241a10,{roughness:.6});
  box(.2,.14,1.12,xw,2.18,doorZ,fm,false); box(.2,2.25,.14,xw,1.12,doorZ-.53,fm,false); box(.2,2.25,.14,xw,1.12,doorZ+.53,fm,false);
  const dHex='#'+(opts.color||0x3f2d1e).toString(16).padStart(6,'0');
  const dmat=std(opts.color||0x3f2d1e,{map:tx(texDoor(dHex,'rgba(0,0,0,.6)')),roughness:.62});
  const hinge=new THREE.Group(); hinge.position.set(xw,0,doorZ-.475); world.add(hinge);
  const leaf=new THREE.Mesh(new THREE.BoxGeometry(.07,2.08,.95),dmat); leaf.position.set(0,1.04,.475); hinge.add(leaf);
  const knob=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),std(0xa89050,{roughness:.3,metalness:.7})); knob.position.set(-side*.06,1.02,.82); hinge.add(knob);
  const pl=new THREE.Mesh(new THREE.PlaneGeometry(.19,.15),new THREE.MeshStandardMaterial({map:tx(texPlate(num)),roughness:.5}));
  pl.position.set(-side*.045,1.6,.475); pl.rotation.y=-side*Math.PI/2; hinge.add(pl);
  const col=addCol(xw-.11,xw+.11,doorZ-.55,doorZ+.55);
  const o={open:false,col,hinge,side};
  const it={x:xw,y:1.2,z:doorZ,r:2.1,prompt:opts.prompt||'افتحي الباب',fn:()=>{
    if(o.open)return;
    if(opts.gate&&!opts.gate()){ sfxKnock(.2); say(opts.lockedMsg||'مقفول.',2); return; }
    o.open=true; it.enabled=false;
    colliders=colliders.filter(cc=>cc!==col); sfxDoor();
    anims.push({t:0,dur:1.2,fn:k=>{hinge.rotation.y=side*1.85*k;}});
    if(opts.fn)opts.fn();
  }};
  o.it=it;
  interactables.push(it);
  return o;
}
function makeFakeDoor(side,doorZ,num,lines){
  const xw=side*1.5;

  box(.06,.14,1.12,xw+side*.02,2.16,doorZ,fm,false); box(.06,2.2,.14,xw+side*.02,1.08,doorZ-.53,fm,false); box(.06,2.2,.14,xw+side*.02,1.08,doorZ+.53,fm,false);

function buildCorridor(L,st,doors){
  scene.fog=new THREE.FogExp2(st.fog,st.fd); scene.background=new THREE.Color(st.fog);
  addHemi(st.hemi||0x2a251c,0x0a0805,st.hemiI||.32);
  const wmat=std(0xffffff,{map:tx(texWall(st.wA,st.wB,{damask:st.dam,cracks:st.cracks}),Math.max(1,L/3.4),1)});
  const fmat=std(0xffffff,{map:tx(texCarpet(st.cA,st.cB),2,L/2.4)});
  box(3.0,.09,L,0,-.045,-L/2,fmat,false);
  box(3.0,.1,L,0,3.1,-L/2,std(0x746c5a,{map:tx(texWall('#6b6353','#5a5344',{}),3,L/3)}),false);
  const realRefs=[];

    const xw=s*1.575, list=doors.filter(d=>d.s===s);
    const reals=list.filter(d=>d.real).sort((a,b)=>b.z-a.z);
    let cur=.08;
    const seg=(a,b)=>{ const len=Math.abs(b-a); if(len<=.02)return; box(.15,3.1,len,xw,1.55,(a+b)/2,wmat); };
    for(const d of reals){
      const near=d.z+.5;
      seg(Math.min(cur,near),Math.max(cur,near));
      box(.15,1.0,1.06,xw,2.6,d.z,wmat,false);
      cur=d.z-.5;

  });
  return {wmat,doors:realRefs};
}

  triggers.push({x:-2.6,z:-1.8,r:1.3,fn:()=>{

    sayNow('الباب اتقفل.',1.4);
    sched(1500,()=>{ startRing(); say('التليفون… على الأرض جنب السرير. بيرنّ.',2.4); obj('ردي على التليفون'); });
  }});
  interactables.push({x:-6.1,y:.5,z:-1.2,r:1.9,prompt:'ردي على التليفون',fn:()=>{
    if(phAnswered){ say('ميت.',1.4); return; }
    phAnswered=true; stopRing(); sfxStatic(); speakAr('بصي تحت الغطا');
    say('صوت… مش بيتكلم. بيتنفس في السماعة.',2.2);
    say('وبعدين جملة واحدة: «وصلتي. بصّي تحت الغطا.»',3);
    sched(7000,()=>{ say('الغطا… بيتحرك لوحده. بصّي تحته.',2.2); obj('اشيلي الغطا'); });
  }});
  const slIt={x:r1313.bedX,y:1,z:r1313.bedZ,r:2.3,prompt:'بصّي للنُوام',fn:function(){
    if(fin)return;
    say('النَفَس بيطول… كإن حد بيعدّ لحد ما تشيليه.',2.6);
    this.prompt='اشيلي الغطا'; this.fn=()=>finale();
    obj('اشيلي الغطا');
  }};
  interactables.push(slIt);
  async function finale(){
    if(fin)return; fin=true; frozen=true; lbEl.classList.add('on'); stopRing();
    startHeart(78); sayNow('……',1);
    await sleep(900); sfxBreath();
    const bl=r1313.sleeper.children[0];
    anims.push({t:0,dur:1.4,fn:k=>{ bl.scale.y=.34+Math.sin(k*Math.PI)*.22; }});
    await sleep(1700);
    anims.push({t:0,dur:.5,fn:k=>{ bl.scale.y=.34*(1-k)+.06*k; }});
    r1313.sleeper.children[1].visible=false; r1313.sleeper.children[2].visible=false;
    sfxHeart(); sayNow('فاضية.',1.4);
    await sleep(1300);
    stopHeart();
    sayNow('…وراك.',1);
    const fig=makeFigure(-2.1,-1.8,true);
    sfxKnock(1); shake=.8; lightScale=.06;
    await sleep(650);
    startHeart(142); startBreath();
    const fp=new THREE.Vector3(-2.1,0,-1.8), tp=new THREE.Vector3(player.x,0,player.z);
    anims.push({t:0,dur:2.3,fn:k=>{ fig.position.lerpVectors(fp,tp,k*k); fig.lookAt(player.x,1.3,player.z); shake=Math.max(shake,.4); }});
    await sleep(2250);
    sfxStatic(); sfxKnock(1.2);
    stopLoops(); setDrone(0,300);
    fade(1,.02);
    await sleep(2600);
    showEnding();
  }
  startAt(1300,()=>{ startHeart(54); startBreath(); });
  startAt(2400,()=>say('الدور اللي مفيشوش على أي لوحة… انتِ واقفة فيه.',3));
  startAt(9000,()=>{ sfxKnock(.2,.5); say('الخبطات دي… بتزيد ولا بتقرب؟',2.4); });
  startAt(17000,()=>sfxWhisper());
  obj('امشي في الممر… لآخره');
  levelTick=(dt,t)=>{
    [f1,f2].forEach(f=>{ if(!f)return;
      f.lookAt(player.x,0,player.z);
      const dd=Math.hypot(f.position.x-player.x,f.position.z-player.z);
      if(dd<4.2){ world.remove(f); if(f1===f)f1=null; else f2=null;
        sfxWhisper(); shake=.3; lightScale=Math.max(.05,lightScale*.5); sched(700,()=>{ lightScale=1; }); }
    });
    if(f3){
      f3.lookAt(player.x,0,player.z);
      const dd=Math.hypot(f3.position.x-player.x,f3.position.z-player.z);
      if(dd<2.6){
        const st=f3.position.clone(), tgt=new THREE.Vector3(-1.55,0,-1.8);
        const fref=f3;
        anims.push({t:0,dur:.7,fn:k=>{ fref.position.lerpVectors(st,tgt,k); },done:()=>{ world.remove(fref); }});
        f3=null; sfxDoor(); door1313Open=true;
        doorOpen(cor.doors.find(d=>d.n===1313).o,2.2);
        sayNow('دخلت. …والباب فتح نفسه وراها.',2.4);
        sched(2700,()=>say('آخر باب في الممر. مفيش غيره.',2.2));
      }
    }
    kAcc+=dt; if(kAcc>7){ kAcc=0; sfxKnock(.18,(Math.random()-.5)); }
  };
}

/* ---- النهاية ---- */
function showEnding(){
  gameOver=true; frozen=true;
  try{document.exitPointerLock();}catch(e){}
  promptEl.classList.remove('show'); subEl.classList.remove('show'); hideObj(); lbEl.classList.remove('on');
  endEl.style.display='flex'; endEl.style.opacity=0;
  requestAnimationFrame(()=>{ endEl.style.transition='opacity 2.5s'; endEl.style.opacity=1; });
}

/* ================== اللاعب والحركة ================== */
const keys={};
let moveAmt=0, joyX=0, joyY=0, joyId=null, joyBX=0, joyBY=0, lookId=null, lookLX=0, lookLY=0;
function tryMove(nx,nz){
  const R=.3; let okX=true, okZ=true;
  for(const c of colliders){
    if(c.y1>1.6)continue;
    if(nx>c.x1-R&&nx<c.x2+R&&player.z>c.z1-R&&player.z<c.z2+R)okX=false;
    if(player.x>c.x1-R&&player.x<c.x2+R&&nz>c.z1-R&&nz<c.z2+R)okZ=false;
  }
  if(okX)player.x=nx; if(okZ)player.z=nz;
}
function updatePlayer(dt){
  let mx=0,mz=0;
  if(!IS_TOUCH){
    if(keys['KeyW']||keys['ArrowUp'])mz+=1; if(keys['KeyS']||keys['ArrowDown'])mz-=1;
    if(keys['KeyA']||keys['ArrowLeft'])mx-=1; if(keys['KeyD']||keys['ArrowRight'])mx+=1;
  }else{ mx=joyX; mz=joyY; }
  const mag=Math.min(1,Math.hypot(mx,mz));
  const run=(!IS_TOUCH&&(keys['ShiftLeft']||keys['ShiftRight']))||(IS_TOUCH&&mag>.92);
  if(mag>.06){
    lastMove=clockT.elapsedTime;
    const fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
    let dx=fx*mz+rx*mx, dz=fz*mz+rz*mx;
    const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const sp=(run?4.3:2.4)*mag;
    tryMove(player.x+dx*sp*dt, player.z+dz*sp*dt);
    const moved=sp*dt;
    stepAcc+=moved; bobP+=moved*2.3;
    const stepLen=run?1.85:1.4;
    if(stepAcc>stepLen){ stepAcc=0; sfxStep(run?.38:.3,(Math.random()-.5)*.5,echoMode?.75:1);
      if(echoMode)sched(300,()=>sfxStep(.14,0,.5)); }
  }
  moveAmt+=((mag>.06?1:0)-moveAmt)*Math.min(1,dt*8);
}
function interact(){
  if(!started||paused||gameOver||frozen||panelOpen||noteOpen)return;
  if(curInter&&curInter.fn)curInter.fn();
}
function scanInteract(){
  if(frozen||paused||gameOver||panelOpen||noteOpen){ curInter=null; promptEl.classList.remove('show'); btnE.classList.remove('hot'); return; }
  let best=null,bd=1e9;
  const fx=-Math.sin(yaw)*Math.cos(pitch), fz=-Math.cos(yaw)*Math.cos(pitch);
  for(const it of interactables){
    if(it.enabled===false)continue;
    const dx=it.x-player.x, dz=it.z-player.z, d=Math.hypot(dx,dz);
    if(d>it.r)continue;
    if(d>.6){ const dot=(dx*fx+dz*fz)/(d||1); if(dot<.2)continue; }
    if(d<bd){bd=d;best=it;}
  }
  curInter=best;
  if(best){ promptTxt.textContent=best.prompt; promptEl.classList.add('show'); btnE.classList.add('hot'); }
  else{ promptEl.classList.remove('show'); btnE.classList.remove('hot'); }
}

/* ================== المدخلات ================== */
const cvEl=$('game');
addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.repeat)return;
  if(e.code==='KeyE'){ if(noteOpen){closeNote();return;} if(panelOpen)return; interact(); }
  if(e.code==='KeyP'&&started&&!gameOver&&!panelOpen&&!noteOpen)togglePause();
  if(e.code==='Escape'&&paused)togglePause();
});
addEventListener('keyup',e=>keys[e.code]=false);
cvEl.addEventListener('click',()=>{
  if(started&&!paused&&!gameOver&&!panelOpen&&!noteOpen&&!IS_TOUCH&&document.pointerLockElement!==cvEl){
    try{ const p=cvEl.requestPointerLock(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
  }
});
document.addEventListener('pointerlockchange',()=>{
  const locked=document.pointerLockElement===cvEl;
  if(!locked&&started&&!gameOver&&!panelOpen&&!noteOpen&&!expectUnlock&&!paused&&!frozen)setPause(true);
  expectUnlock=false;
});
document.addEventListener('mousemove',e=>{
  if(document.pointerLockElement===cvEl&&!paused){
    yaw-=e.movementX*.0021;
    pitch=Math.max(-1.25,Math.min(1.25,pitch-e.movementY*.0021));
  }
});
/* لمس: عصا شمال + نظر يمين */
cvEl.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(!started||paused||gameOver||panelOpen||noteOpen)return;
  for(const t of e.changedTouches){
    if(t.clientX<innerWidth*.46&&joyId===null){
      joyId=t.identifier; joyBX=t.clientX; joyBY=t.clientY;
      joyBase.style.left=(joyBX-60)+'px'; joyBase.style.top=(joyBY-60)+'px'; joyBase.style.bottom='auto';
      joyKnob.style.transform='translate(0,0)';
    } else if(lookId===null){ lookId=t.identifier; lookLX=t.clientX; lookLY=t.clientY; }
  }
},{passive:false});
cvEl.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      let dx=t.clientX-joyBX, dy=t.clientY-joyBY;
      const l=Math.hypot(dx,dy); if(l>46){ dx*=46/l; dy*=46/l; }
      joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
      joyX=dx/46; joyY=-dy/46;
    } else if(t.identifier===lookId){
      yaw-=(t.clientX-lookLX)*.0052;
      pitch=Math.max(-1.25,Math.min(1.25,pitch-(t.clientY-lookLY)*.0052));
      lookLX=t.clientX; lookLY=t.clientY;
    }
  }
},{passive:false});
const endT=e=>{ for(const t of e.changedTouches){
  if(t.identifier===joyId){ joyId=null; joyX=joyY=0; joyKnob.style.transform='translate(0,0)'; joyBase.style.left='26px'; joyBase.style.top='auto'; joyBase.style.bottom='26px'; }
  if(t.identifier===lookId)lookId=null; } };
cvEl.addEventListener('touchend',endT); cvEl.addEventListener('touchcancel',endT);
btnE.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); if(noteOpen){closeNote();return;} interact(); },{passive:false});
btnE.addEventListener('click',e=>{ e.stopPropagation(); interact(); });
btnPause.addEventListener('touchstart',e=>{ e.preventDefault(); e.stopPropagation(); togglePause(); },{passive:false});
btnPause.addEventListener('click',e=>{ e.stopPropagation(); togglePause(); });

/* ================== الوقفة ================== */
function setPause(v){
  if(v&&(frozen||!started||gameOver))return;
  paused=v; pauseEl.style.display=v?'flex':'none';
  if(v){
    if(AC&&AC.state==='running')AC.suspend();
    if(document.pointerLockElement===cvEl){ expectUnlock=true; try{document.exitPointerLock();}catch(e){} }
    $('pauseHelp').innerHTML=IS_TOUCH?'المسي الشاشة عشان ترجعي.':'P أو Esc للرجوع — W A S D للحركة و E للتفاعل';
  } else { if(AC&&AC.state==='suspended')AC.resume(); }
}
function togglePause(){ if(!started||gameOver)return; setPause(!paused); }
pauseEl.addEventListener('click',()=>{
  setPause(false);
  if(!IS_TOUCH&&started&&!gameOver){ try{ const p=cvEl.requestPointerLock(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
});

/* ================== الحلقة الرئيسية ================== */
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,clockT.getDelta()), t=clockT.elapsedTime;
  if(started&&!paused&&!gameOver){
    if(!frozen&&!panelOpen&&!noteOpen)updatePlayer(dt);
    for(let i=anims.length-1;i>=0;i--){ const a=anims[i]; a.t+=dt/a.dur; const k=Math.min(1,a.t); a.fn(k);
      if(k>=1){ anims.splice(i,1); if(a.done)a.done(); } }
    for(const f of flickers){ const n=Math.sin(t*f.sp)*Math.sin(t*f.sp*.63+1.3);
      let v=f.base*lightScale*(1+f.amp*.55*n); if(Math.random()<.004)v*=.12; f.L.intensity=v; }
    if(!frozen)for(const tr of triggers){ if(tr.done)continue;
      if(Math.hypot(player.x-tr.x,player.z-tr.z)<tr.r){ tr.done=true; tr.fn(); } }
    if(levelTick)levelTick(dt,t);
    scanInteract();
  }
  const bob=Math.sin(bobP)*.05*moveAmt;
  camera.position.set(player.x,PLAYER_H+bob,player.z);
  if(shake>0){ camera.position.x+=(Math.random()-.5)*shake*.14; camera.position.y+=(Math.random()-.5)*shake*.1; shake=Math.max(0,shake-dt*1.1); }
  camera.rotation.set(pitch,yaw,Math.sin(bobP*.5)*.004*moveAmt);
  renderer.render(scene,camera);
}

/* ================== التشغيل ================== */
applyIcon(); init(); loop();
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){} }
titleEl.addEventListener('click',()=>{
  if(started)return; started=true;
  try{ initAudio(); if(AC.state==='suspended')AC.resume(); }catch(e){}
  titleEl.style.opacity=0; setTimeout(()=>titleEl.style.display='none',1000);
  lbEl.classList.add('on');
  gotoLevel(0,'الفندق فاضي… من ١٣ سنة. // وانتِ صحيتي جوه.');
});
 $('again').addEventListener('click',()=>location.reload());
</script>

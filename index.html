<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Amiri',serif;color:#d9d0bd;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:fixed;inset:0;display:block;touch-action:none}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.62) 100%)}
#grain{position:fixed;inset:-120px;pointer-events:none;z-index:31;opacity:.055;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.7'/></svg>");animation:grain .8s steps(4) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-25px,35px)}50%{transform:translate(30px,-20px)}75%{transform:translate(-20px,-30px)}100%{transform:translate(0,0)}}
#letterbox .bar{position:fixed;left:0;width:100%;height:0;background:#000;z-index:35;transition:height 1s ease}
#letterbox .bar.top{top:0}#letterbox .bar.bottom{bottom:0}
#letterbox.on .bar{height:11vh}
#objective{position:fixed;top:20px;right:24px;z-index:32;font-size:19px;color:#c4bba6;border-right:3px solid #6e1d18;padding:4px 14px 4px 20px;max-width:340px;text-align:right;opacity:0;transition:opacity .8s;background:rgba(0,0,0,.35)}
#objective.show{opacity:1}
#subtitle{position:fixed;bottom:13%;left:0;width:100%;text-align:center;z-index:32;font-size:27px;color:#e6dcc6;text-shadow:0 2px 10px #000;opacity:0;transition:opacity .3s;pointer-events:none;padding:0 12vw}
#subtitle.show{opacity:1}
#prompt{position:fixed;bottom:26%;left:0;width:100%;text-align:center;z-index:32;opacity:0;transition:opacity .15s;pointer-events:none;font-size:22px}
#prompt.show{opacity:1}
#prompt .key{display:inline-block;border:1.5px solid #9c9280;border-radius:4px;padding:0 9px;margin-left:10px;font-weight:700;color:#c9bfa8;background:rgba(0,0,0,.5);vertical-align:middle}
#crosshair{position:fixed;top:50%;left:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(230,220,200,.55);z-index:32}
#floorDisplay{position:fixed;top:13vh;width:100%;text-align:center;z-index:36;font-family:'Rakkas';font-size:76px;color:#cfc5ac;text-shadow:0 3px 14px #000;opacity:0;transition:opacity .3s;pointer-events:none}
#floorDisplay.show{opacity:1}
#floorDisplay.red{color:#c22a20}
#elevatorPanel{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.45)}
#elevatorPanel .panelBox{background:#17161a;border:1px solid #3a3730;border-top:3px solid #585142;padding:26px 30px;min-width:280px;box-shadow:0 20px 60px #000}
#elevatorPanel .panelTitle{text-align:center;font-size:24px;color:#a99f88;margin-bottom:16px}
#btnGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;justify-items:center}
#btnGrid .ebtn{width:64px;height:64px;border-radius:50%;background:#232019;border:1px solid #4a4438;color:#b3a98f;font-family:'Amiri';font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .06s}
#btnGrid .ebtn:active{transform:scale(.9)}
#btnGrid .ebtn.go{border-color:#8a6f3a;color:#d8c48a}
#btnGrid .ebtn.dead{background:#14120e;color:#3c362c;cursor:default;border-color:#262219}
#btnGrid .ebtn.thirteen{border-color:#7e1f1a;color:#d9402f;font-size:34px;animation:pulse13 1.6s infinite}
@keyframes pulse13{0%,100%{box-shadow:0 0 0 0 rgba(160,35,25,0)}50%{box-shadow:0 0 18px 2px rgba(160,35,25,.35)}}
.panelHint{text-align:center;margin-top:16px;color:#6f675a;font-size:17px}
#panelClose{display:block;margin:14px auto 0;background:none;border:1px solid #4a4438;color:#8d8471;font-family:'Amiri';font-size:18px;padding:4px 22px;cursor:pointer}
#noteOverlay{position:fixed;inset:0;z-index:48;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(0,0,0,.82);cursor:pointer}
#noteOverlay img{max-height:60vh;max-width:86vw;box-shadow:0 30px 80px #000;border:6px solid #111}
#noteText{margin-top:20px;font-size:25px;color:#d9d0bd;text-align:center;max-width:86vw;line-height:1.7;padding:0 4vw}
#noteHint{margin-top:10px;font-size:15px;color:#6f675a}
#fade{position:fixed;inset:0;background:#000;z-index:60;opacity:1;pointer-events:none;transition:opacity .1s;display:flex;align-items:center;justify-content:center}
#fadeText{font-size:30px;color:#bfb59d;text-align:center;max-width:80vw;opacity:0;transition:opacity .6s;padding:0 20px}
#pause{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.78);cursor:pointer;text-align:center}
#pause .big{font-size:38px;margin-bottom:14px}
#pause .small{font-size:19px;color:#8d8471;line-height:2;padding:0 20px}
#title{position:fixed;inset:0;z-index:70;background:#050403;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;text-align:center;transition:opacity .9s}
#titleLogo{width:96px;height:96px;border:1px solid #2c251c;margin-bottom:18px;opacity:.9}
#title h1{font-family:'Rakkas';font-size:min(110px,15vw);color:#8c211b;font-weight:400;line-height:1.1;letter-spacing:2px}
#title .tag{font-size:22px;color:#9a917d;margin-top:8px;padding:0 20px}
#title .controls{margin-top:38px;font-size:17px;color:#776f5e;line-height:2.2;padding:0 20px;max-width:92vw}
#title .controls b{color:#b3a98f;border:1px solid #4a4438;border-radius:4px;padding:1px 10px;font-weight:400}
#title .enter{margin-top:40px;font-size:23px;color:#c9bfa8;animation:blink 2.4s infinite;padding:0 20px}
#title .warn{margin-top:14px;font-size:15px;color:#5c5546;padding:0 20px}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
#ending{position:fixed;inset:0;z-index:80;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 6vw}
#ending img{width:84px;height:84px;margin-bottom:20px;opacity:.85}
#ending h1{font-family:'Rakkas';font-size:min(100px,14vw);color:#8c211b;font-weight:400}
#ending p{font-size:23px;color:#9a917d;margin-top:16px;line-height:2}
#ending button{margin-top:44px;background:none;border:1px solid #6e1d18;color:#c9bfa8;font-family:'Amiri';font-size:22px;padding:10px 42px;cursor:pointer}
#ending button:hover{background:#1a0908}
#touchUI{display:none}
body.touch #touchUI{display:block}
#joyBase{position:fixed;left:26px;bottom:26px;width:120px;height:120px;border-radius:50%;border:1.5px solid rgba(217,208,189,.28);background:rgba(0,0,0,.22);z-index:33;pointer-events:none}
#joyKnob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(217,208,189,.2);border:1.5px solid rgba(217,208,189,.45)}
#btnE{position:fixed;right:26px;bottom:38px;width:80px;height:80px;border-radius:50%;background:rgba(30,20,15,.5);border:1.5px solid rgba(200,168,106,.45);color:#d8c48a;font-size:32px;font-family:'Amiri';display:flex;align-items:center;justify-content:center;z-index:33;transition:transform .15s,background .15s}
#btnE.hot{border-color:#e8c87a;background:rgba(110,70,20,.7);transform:scale(1.16)}
#btnPause{position:fixed;top:16px;left:16px;width:46px;height:46px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid rgba(217,208,189,.3);z-index:33;display:flex;align-items:center;justify-content:center;gap:5px}
#btnPause i{display:block;width:5px;height:18px;background:rgba(217,208,189,.7)}
@media (max-width:700px){
 #subtitle{font-size:19px;bottom:19%;padding:0 7vw}
 #objective{font-size:13px;max-width:58vw;top:12px;right:12px}
 #prompt{font-size:17px;bottom:30%}
 #floorDisplay{font-size:52px}
 #noteText{font-size:20px}
 #elevatorPanel .ebtn{width:56px;height:56px;font-size:22px}
}
</style>

<body>
<canvas id="game"></canvas>
<div id="vignette"></div><div id="grain"></div>
<div id="letterbox"><div class="bar top"></div><div class="bar bottom"></div></div>
<div id="objective"></div>
<div id="subtitle"></div>
<div id="prompt"><span id="promptText"></span><span class="key">E</span></div>
<div id="crosshair"></div>
<div id="floorDisplay"></div>
<div id="elevatorPanel"><div class="panelBox"><div class="panelTitle">لوحة المصعد</div><div id="btnGrid"></div><div class="panelHint" id="panelHint">اختاري الدور</div><button id="panelClose">ابعدِ عن اللوحة</button></div></div>
<div id="noteOverlay"><img id="noteImg" alt=""><div id="noteText"></div><div id="noteHint">اضغطي E أو المسي الشاشة عشان تقفلي</div></div>

<div id="title">

 <h1>الغرفة ١٣</h1>

</div>
<div id="ending"><img id="endLogo" alt=""><h1>FLOOR 13</h1><p>الفندق ده اتقفل من ١٣ سنة.<br>مفيش حد دخل فيه… ومفيش حد خرج.<br>…إلا انتي.</p><button id="again">صحي من أول ما جيتي</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   الغرفة ١٣ — كمبيوتر + موبايل، ملف واحد
   الإصدار الخامس: إصلاح لغز الصورة (كان محتاج تبعدي وترجعي
   من غير ما يقولك) + إرشاد أوضح في كل المستويات
   ============================================================ */
const $=id=>document.getElementById(id);
const subEl=$('subtitle'),objEl=$('objective'),promptEl=$('prompt'),promptTxt=$('promptText'),
      fadeEl=$('fade'),fadeTxt=$('fadeText'),floorEl=$('floorDisplay'),panelEl=$('elevatorPanel'),
      noteEl=$('noteOverlay'),noteImg=$('noteImg'),noteText=$('noteText'),pauseEl=$('pause'),
      titleEl=$('title'),endEl=$('ending'),lbEl=$('letterbox'),btnGrid=$('btnGrid'),panelHint=$('panelHint'),
      joyBase=$('joyBase'),joyKnob=$('joyKnob'),btnE=$('btnE'),btnPause=$('btnPause');
const IS_TOUCH=('ontouchstart'in window)||navigator.maxTouchPoints>0;
if(IS_TOUCH){ document.body.classList.add('touch');
  $('titleControls').innerHTML='المسي نصّ الشاشة الشمال = عصا الحركة — اسحبي على اليمين عشان تبصّي — زر <b>E</b> للتفاعل — ادفعي العصا للآخر = جري';
  $('titleWarn').textContent='الوضع الأفقي أحلى… بس العمودي شغال عادي.';
}else{
  $('titleControls').innerHTML='<b>W A S D</b> للحركة &nbsp;•&nbsp; <b>الماوس</b> للنظر &nbsp;•&nbsp; <b>E</b> للتفاعل &nbsp;•&nbsp; <b>Shift</b> للجري';
}

/* ================== اللوجو والأيقونة ================== */
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function makeIconCanvas(){
  const c=mkCanvas(512,512),x=c.getContext('2d');
  x.fillStyle='#050403'; x.fillRect(0,0,512,512);
  x.fillStyle='#241a10'; x.fillRect(96,70,320,420);
  x.fillStyle='#6e1d18'; x.fillRect(118,92,276,398);
  x.strokeStyle='rgba(0,0,0,.45)'; x.lineWidth=10;
  x.strokeRect(152,200,208,100); x.strokeRect(152,330,208,100);
  x.fillStyle='#c8a86a'; x.fillRect(196,108,120,74);
  x.fillStyle='#191410'; x.font='bold 58px Georgia'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('13',256,148);
  x.fillStyle='#191410'; x.beginPath(); x.arc(256,368,18,0,7); x.fill();
  x.fillRect(247,376,18,40);
  return c;
}
function applyIcon(){
  try{
    const c=makeIconCanvas(), url=c.toDataURL('image/png');
    const link=(rel,href,type)=>{ const l=document.createElement('link'); l.rel=rel; l.href=href; if(type)l.type=type; document.head.appendChild(l); return l; };
    link('icon',url,'image/png'); link('apple-touch-icon',url);
    const man={ name:'الغرفة 13', short_name:'الغرفة 13', description:'لعبة رعب — الدور ١٣',
      start_url:location.href.split('#')[0], display:'standalone', orientation:'any',
      background_color:'#050403', theme_color:'#050403',
      icons:[{src:url,sizes:'512x512',type:'image/png',purpose:'any'},
             {src:url,sizes:'192x192',type:'image/png',purpose:'any'},
             {src:url,sizes:'512x512',type:'image/png',purpose:'maskable'}] };
    link('manifest','data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man)));
    $('titleLogo').src=url; $('endLogo').src=url;
  }catch(e){}
}

/* ================== الصوت (Web Audio كله مولّد) ================== */
let AC=null,master=null,nbuf=null,droneG=null,droneF=null,humG=null,ringInt=null,heartInt=null,breathInt=null;
function initAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  const len=AC.sampleRate*2, b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0);
  let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; } nbuf=b;
  const src=AC.createBufferSource(); src.buffer=nbuf; src.loop=true;
  droneF=AC.createBiquadFilter(); droneF.type='lowpass'; droneF.frequency.value=170;
  droneG=AC.createGain(); droneG.gain.value=0;
  src.connect(droneF).connect(droneG).connect(master); src.start();
  const o=AC.createOscillator(); o.frequency.value=47; const og=AC.createGain(); og.gain.value=.5;
  o.connect(og).connect(droneG); o.start();
}
function setDrone(g,f){ if(!droneG)return; const t=AC.currentTime; droneG.gain.linearRampToValueAtTime(g,t+1.5); droneF.frequency.linearRampToValueAtTime(f,t+1.5); }
function panNode(p){ if(AC.createStereoPanner){const n=AC.createStereoPanner();n.pan.value=p;return n;} return AC.createGain(); }
function env(g,t,a,v,d){ g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+d); }
function sfxStep(vol=.34,pan=0,muf=1){
  if(!AC)return; const t=AC.currentTime;
  const s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=(0.9+Math.random()*.2)*muf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=(360+Math.random()*180)*muf;
  const g=AC.createGain(); env(g,t,.012,vol,.2+muf*.08);
  const p=panNode(pan); s.connect(f).connect(g).connect(p).connect(master); s.start(t); s.stop(t+.3);
  const o=AC.createOscillator(); o.frequency.value=68+Math.random()*24; const og=AC.createGain(); env(og,t,.01,vol*.45,.11);
  o.connect(og).connect(p); o.start(t); o.stop(t+.14);
}
function sfxKnock(vol=1,pan=0){
  if(!AC)return; const t=AC.currentTime,p=panNode(pan);
  const o=AC.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(48,t+.18);
  const g=AC.createGain(); env(g,t,.006,vol,.4); o.connect(g).connect(p).connect(master); o.start(t); o.stop(t+.45);
  const s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=1.7;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
  const g2=AC.createGain(); env(g2,t,.004,vol*.35,.12); s.connect(f).connect(g2).connect(p).connect(master); s.start(t); s.stop(t+.15);
}
function sfxDing(low=false){
  if(!AC)return; const t=AC.currentTime, base=low?[493,659]:[987,1318];
  base.forEach((fr,i)=>{ const o=AC.createOscillator(); o.frequency.value=fr*(low?.97:1);
    const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22/(i+1),t+.015); g.gain.exponentialRampToValueAtTime(.0001,t+(low?2.2:1.4));
    o.connect(g).connect(master); o.start(t); o.stop(t+2.4); });
}
function sfxClick(){ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(); o.frequency.value=1900;
  const g=AC.createGain(); env(g,t,.002,.12,.05); o.connect(g).connect(master); o.start(t); o.stop(t+.07); }
function sfxTick(strong=false){ if(!AC)return; const t=AC.currentTime,o=AC.createOscillator(); o.frequency.value=strong?1500:1050;
  const g=AC.createGain(); env(g,t,.002,strong?.2:.09,strong?.09:.05); o.connect(g).connect(master); o.start(t); o.stop(t+.12); }
function sfxStatic(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=3;
  const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=1200;
  const g=AC.createGain(); env(g,t,.02,.25,.5); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+.6); }
function sfxDoor(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=.4;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=260;
  const g=AC.createGain(); env(g,t,.08,.5,1.1); s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.2);
  setTimeout(()=>sfxKnock(.25),900); }
function sfxWhisper(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=.8;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=6; f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(400,t+2.2);
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.13,t+.9); g.gain.linearRampToValueAtTime(.0001,t+2.3);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+2.4); }
function sfxBreath(){ if(!AC)return; const t=AC.currentTime,s=AC.createBufferSource(); s.buffer=nbuf; s.playbackRate.value=.5;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=2; f.frequency.value=520;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.09,t+.7); g.gain.linearRampToValueAtTime(.0001,t+1.7);
  s.connect(f).connect(g).connect(master); s.start(t); s.stop(t+1.8); }
function sfxHeart(){ if(!AC)return; [0,.22].forEach(dt=>{ const t=AC.currentTime+dt,o=AC.createOscillator(); o.frequency.value=58;
  const g=AC.createGain(); env(g,t,.01,.5,.18); o.connect(g).connect(master); o.start(t); o.stop(t+.22); }); }
function startRing(){ stopRing(); if(!AC)return; const burst=()=>{ const t=AC.currentTime;
  const o1=AC.createOscillator(),o2=AC.createOscillator(); o1.frequency.value=620; o2.frequency.value=832;
  const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.13,t+.05);
  g.gain.setValueAtTime(.13,t+1.1); g.gain.linearRampToValueAtTime(.0001,t+1.25);
  const lfo=AC.createOscillator(); lfo.frequency.value=19; const lg=AC.createGain(); lg.gain.value=.09;
  lfo.connect(lg).connect(g.gain); lfo.start(t); lfo.stop(t+1.3);
  o1.connect(g); o2.connect(g); g.connect(master); o1.start(t); o2.start(t); o1.stop(t+1.3); o2.stop(t+1.3); };
  burst(); ringInt=setInterval(burst,2600); }
function stopRing(){ if(ringInt){clearInterval(ringInt);ringInt=null;} }
function startHum(){ stopHum(); if(!AC)return; const t=AC.currentTime;
  const o=AC.createOscillator(); o.type='sawtooth'; o.frequency.value=52;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=180;

  colliders=[];interactables=[];triggers=[];anims=[];flickers=[];levelTick=null;

  const tok=levelToken+1; levelToken=tok;
  frozen=true; hideObj(); subEl.classList.remove('show'); subQ=[]; subTok++;

function buildCorridor(L,st,doors){
  scene.fog=new THREE.FogExp2(st.fog,st.fd); scene.background=new THREE.Color(st.fog);
  addHemi(st.hemi||0x2a251c,0x0a0805,st.hemiI||.32);
  const wmat=std(0xffffff,{map:tx(texWall(st.wA,st.wB,{damask:st.dam,cracks:st.cracks}),Math.max(1,L/3.4),1)});
  const fmat=std(0xffffff,{map:tx(texCarpet(st.cA,st.cB),2,L/2.4)});
  box(3.0,.09,L,0,-.045,-L/2,fmat,false);
  box(3.0,.1,L,0,3.1,-L/2,std(0x746c5a,{map:tx(texWall('#6b6353','#5a5344',{}),3,L/3)}),false);
  [1,-1].forEach(s=>{
    const xw=s*1.575, list=doors.filter(d=>d.s===s);
    const reals=list.filter(d=>d.real).sort((a,b)=>b.z-a.z);

    for(const d of reals){

      box(.15,1.0,1.06,xw,2.6,d.z,wmat,false);
      cur=d.z-.5;

}

/* تريجرز */
function addTrigger(x1,x2,z1,z2,fn,once=true){ triggers.push({x1:Math.min(x1,x2),x2:Math.max(x1,x2),z1:Math.min(z1,z2),z2:Math.max(z1,z2),fn,once,prev:false}); }
function updateTriggers(){
  for(const tr of triggers){
    const inT=player.x>tr.x1-.3&&player.x<tr.x2+.3&&player.z>tr.z1-.3&&player.z<tr.z2+.3;
    if(inT&&!tr.prev){ tr.prev=true; if(tr.once){ const i=triggers.indexOf(tr); if(i>=0)triggers.splice(i,1); } tr.fn(); }
    else if(!inT) tr.prev=false;
  }
}

  showFloor('١٣',true,false); sfxDing(true); shake=1.0;
  await sleep(2600); stopHum();
  gotoLevel(7,null);
}

/* ================== الإدخال: كمبيوتر + لمس ================== */
const keys={};
addEventListener('keydown',e=>{ keys[e.code]=true; if(e.code==='KeyE')tryInteract();
  if(e.code==='Escape'&&!document.pointerLockElement&&started&&!gameOver){
    paused=!paused; pauseEl.style.display=paused?'flex':'none'; } });
addEventListener('keyup',e=>{ keys[e.code]=false; });
function tryLock(){ try{ const p=renderer.domElement.requestPointerLock(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }
document.addEventListener('pointerlockchange',()=>{
  const locked=document.pointerLockElement===renderer.domElement;
  if(locked){ hadLock=true; paused=false; expectUnlock=false; pauseEl.style.display='none'; }
  else if(hadLock&&started&&!panelOpen&&!noteOpen&&!gameOver){
    if(expectUnlock){ expectUnlock=false; return; }
    paused=true; pauseEl.style.display='flex';
  }
});
pauseEl.addEventListener('click',()=>{ paused=false; pauseEl.style.display='none'; if(!IS_TOUCH)tryLock(); });

let dragging=false,lx=0,ly=0;
addEventListener('mousedown',e=>{ if(!started||gameOver||e.target!==renderer.domElement||document.pointerLockElement)return;
  dragging=true; lx=e.clientX; ly=e.clientY; });
addEventListener('mouseup',()=>dragging=false);
addEventListener('mousemove',e=>{
  if(!started||gameOver||paused)return;
  if(document.pointerLockElement===renderer.domElement){
    yaw-=e.movementX*.0021; pitch=Math.max(-1.35,Math.min(1.35,pitch-e.movementY*.0021));
  } else if(dragging){
    yaw-=(e.clientX-lx)*.0032; pitch=Math.max(-1.35,Math.min(1.35,pitch-(e.clientY-ly)*.0032));
    lx=e.clientX; ly=e.clientY;
  }
});

let joyId=null,joyOX=0,joyOY=0; const joyVec={x:0,y:0}; let joyRun=false,lookId=null,lookX=0,lookY=0;
function joyReset(){ joyVec.x=0; joyVec.y=0; joyRun=false; joyId=null;
  joyKnob.style.transform='translate(0,0)';
  joyBase.style.left='26px'; joyBase.style.top='auto'; joyBase.style.bottom='26px'; }
function bindTouch(cnv){
  cnv.addEventListener('touchstart',e=>{ e.preventDefault(); if(!started||gameOver||paused)return;
    for(const t of e.changedTouches){
      if(t.clientX<innerWidth*.45&&joyId===null){ joyId=t.identifier; joyOX=t.clientX; joyOY=t.clientY;
        joyBase.style.left=(t.clientX-60)+'px'; joyBase.style.top=(t.clientY-60)+'px'; joyBase.style.bottom='auto'; }
      else if(lookId===null){ lookId=t.identifier; lookX=t.clientX; lookY=t.clientY; } }
  },{passive:false});
  cnv.addEventListener('touchmove',e=>{ e.preventDefault(); if(!started||gameOver||paused)return;
    for(const t of e.changedTouches){
      if(t.identifier===joyId){
        let dx=t.clientX-joyOX, dy=t.clientY-joyOY; const d=Math.hypot(dx,dy), max=55;
        if(d>max){ dx=dx/d*max; dy=dy/d*max; }
        joyVec.x=dx/max; joyVec.y=dy/max; joyRun=(d/max)>.85;
        joyKnob.style.transform='translate('+dx+'px,'+dy+'px)';
      } else if(t.identifier===lookId){
        yaw-=(t.clientX-lookX)*.0042; pitch=Math.max(-1.35,Math.min(1.35,pitch-(t.clientY-lookY)*.0042));
        lookX=t.clientX; lookY=t.clientY; } }
  },{passive:false});
  const end=e=>{ for(const t of e.changedTouches){
      if(t.identifier===joyId) joyReset();
      if(t.identifier===lookId) lookId=null; } };
  cnv.addEventListener('touchend',end); cnv.addEventListener('touchcancel',end);
}
btnE.addEventListener('touchstart',e=>{ e.preventDefault(); tryInteract(); },{passive:false});
btnPause.addEventListener('touchstart',e=>{ e.preventDefault(); if(!started||gameOver)return;
  paused=true; pauseEl.style.display='flex'; },{passive:false});

function tryInteract(){
  if(!started||gameOver||paused||frozen||panelOpen)return;
  if(noteOpen){ closeNote(); return; }
  if(curInter&&curInter.enabled!==false) curInter.fn();
}

/* ================== الحلقة الرئيسية ================== */
function collide(px,pz){
  const r=.32;
  for(let k=0;k<2;k++)
  for(const c of colliders){
    if(c.y1>=PLAYER_H) continue;
    if(px>c.x1-r&&px<c.x2+r&&pz>c.z1-r&&pz<c.z2+r){
      const d1=px-(c.x1-r),d2=(c.x2+r)-px,d3=pz-(c.z1-r),d4=(c.z2+r)-pz;
      const m=Math.min(d1,d2,d3,d4);
      if(m===d1)px=c.x1-r; else if(m===d2)px=c.x2+r; else if(m===d3)pz=c.z1-r; else pz=c.z2+r;
    }
  }
  return [px,pz];
}
function updateInteract(){
  curInter=null; let best=1e9;
  const cp=Math.cos(pitch), fx=-Math.sin(yaw)*cp, fy=Math.sin(pitch), fz=-Math.cos(yaw)*cp;
  for(const it of interactables){
    if(it.enabled===false)continue;
    const dx=it.x-player.x, dy=it.y-1.62, dz=it.z-player.z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d>it.r)continue;
    const dot=(dx*fx+dy*fy+dz*fz)/(d||1);
    if(dot<.62)continue;
    if(d<best){best=d;curInter=it;}
  }
  promptTxt.textContent=curInter?curInter.prompt:'';
  promptEl.classList.toggle('show',!!curInter&&!noteOpen&&!panelOpen&&!paused&&!frozen);
  btnE.classList.toggle('hot',!!curInter&&!noteOpen&&!panelOpen&&!paused&&!frozen);
}
function tick(){
  requestAnimationFrame(tick);
  if(!renderer)return;
  const dt=Math.min(clockT.getDelta(),.05), t=clockT.elapsedTime;
  if(started&&!gameOver&&frozen&&fadeBlack&&t-blackSince>20){
    fadeBlack=false; fadeTxt.style.opacity=0;
    fadeEl.style.transitionDuration='1s'; fadeEl.style.opacity=0;
    frozen=false; flushStart();
  }
  for(let i=anims.length-1;i>=0;i--){ const a=anims[i]; a.t+=dt;
    let k=Math.min(1,a.t/a.dur); k=k*k*(3-2*k); a.fn(k);
    if(a.t>=a.dur){ anims.splice(i,1); if(a.done)a.done(); } }
  for(const f of flickers){ f.L.intensity=f.base*(.78+.22*(Math.sin(t*f.sp)*Math.sin(t*f.sp*.37+2)+.4*Math.random()*f.amp))*lightScale; }
  let spd=0;
  if(started&&!paused&&!frozen&&!gameOver&&!panelOpen&&!noteOpen){
    const run=keys['ShiftLeft']||keys['ShiftRight']||joyRun;
    let mx=0,mz=0;
    if(keys['KeyW']||keys['ArrowUp'])mz+=1; if(keys['KeyS']||keys['ArrowDown'])mz-=1;
    if(keys['KeyA']||keys['ArrowLeft'])mx-=1; if(keys['KeyD']||keys['ArrowRight'])mx+=1;
    if(joyId!==null){ mx=joyVec.x; mz=-joyVec.y; }
    if(mx||mz){
      spd=run?4.6:2.25;
      const l=Math.hypot(mx,mz); mx/=l; mz/=l;
      const fx=-Math.sin(yaw),fz=-Math.cos(yaw), rx=Math.cos(yaw),rz=-Math.sin(yaw);
      let nx=player.x+(fx*mz+rx*mx)*spd*dt, nz=player.z+(fz*mz+rz*mx)*spd*dt;
      [nx,nz]=collide(nx,nz); player.x=nx; player.z=nz;
      stepAcc+=spd*dt; bobP+=spd*dt*2.5; lastMove=t;
      if(stepAcc>(run?.5:.72)){ stepAcc=0; sfxStep(run?.5:.34);
        if(echoMode) sched(380,()=>sfxStep(run?.42:.24,(Math.random()-.5)*.3,.5)); }
    }
  }
  const bobY=Math.sin(bobP)*.042*Math.min(1,spd/2.2)+Math.sin(t*1.3)*.006;
  camera.position.set(player.x+(Math.random()-.5)*shake*.06,1.62+bobY+(Math.random()-.5)*shake*.05,player.z+(Math.random()-.5)*shake*.06);
  camera.rotation.set(pitch,yaw,Math.sin(bobP)*.006*Math.min(1,spd/2.2));
  shake=Math.max(0,shake-dt*1.4);
  if(started&&!gameOver&&!paused){ updateTriggers(); updateInteract(); if(levelTick)levelTick(dt,t); }
  renderer.render(scene,camera);
}

/* ================== البدء ================== */
function begin(){
  if(started)return; started=true;
  try{ initAudio(); if(AC.state==='suspended')AC.resume(); }catch(e){}
  setDrone(.05,150);
  titleEl.style.opacity=0; setTimeout(()=>titleEl.style.display='none',950);
  fadeEl.style.transitionDuration='1.6s'; fadeEl.style.opacity=0; fadeBlack=false;
  frozen=false;
  if(IS_TOUCH){ try{ if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen(); }catch(e){} }
  else tryLock();
  sched(1800,()=>say('…فين أنا؟',2.2));
  sched(4400,()=>say('مش فاكرة إزاي جيت هنا.',2.5));
  sched(7600,()=>{ say('مفيش صوت… خالص.',2.2); obj('اقرئي الورقة على الترابيزة… وخدي المفتاح'); });
}
titleEl.addEventListener('click',begin);
 $('again').addEventListener('click',()=>location.reload());
 $('pauseHelp').innerHTML=IS_TOUCH
 ? 'المسي الشاشة عشان ترجعي للغرفة ١٣'
 : 'اضغطي في أي مكان عشان ترجعي للغرفة ١٣<br>W A S D للحركة — الماوس للنظر — E للتفاعل — Shift للجري';

init(); bindTouch(renderer.domElement); applyIcon(); buildLevel(0); tick();
</script>
